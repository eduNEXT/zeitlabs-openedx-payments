name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - "**"

jobs:
  # The newest release and the quality checks run first; the older releases and the PII check run only once both have
  # passed.
  first_checks:
    name: tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.12"
            toxenv: py312-verawood
          - os: ubuntu-latest
            python-version: "3.12"
            toxenv: quality
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: pip install -r requirements/ci.in

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: tox

  run_tests:
    name: tests
    needs: first_checks
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
            toxenv: py311-redwood
          - os: ubuntu-latest
            python-version: "3.11"
            toxenv: py311-sumac
          - os: ubuntu-latest
            python-version: "3.11"
            toxenv: py311-teak
          - os: ubuntu-latest
            python-version: "3.11"
            toxenv: py311-ulmo
          - os: ubuntu-latest
            python-version: "3.12"
            toxenv: pii_check
    steps:
      - uses: actions/checkout@v4
      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: pip install -r requirements/ci.in

      - name: Run Tests
        env:
          TOXENV: ${{ matrix.toxenv }}
        run: tox
